<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronEditor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cron Job Editor</h1>
            <a href="/dev" class="dev-link">🛠️ Developer Panel</a>
        </div>
        {% if jobs %}
        <div class="cron-jobs">
            {% for job in jobs %}
            <div class="job-row{% if not job.enabled %} disabled{% endif %}" data-job-id="{{ job.id }}">
                <div class="job-display">
                    <div class="job-time">
                        <span class="time-part">{{ job.minute }}</span><span class="time-part">{{ job.hour }}</span><span class="time-part">{{ job.day }}</span><span class="time-part">{{ job.month }}</span><span class="time-part">{{ job.weekday }}</span>
                    </div>
                    <div class="job-command">{{ job.command }}</div>
                    <div class="job-status"><input type="checkbox" {% if job.enabled %}checked{% endif %} disabled><label>{% if job.enabled %}有効{% else %}無効{% endif %}</label></div>
                    <div class="job-actions"><button class="edit-btn" onclick="editJob({{ job.id }})">編集</button></div>
                </div>
                <div class="job-edit" style="display: none;">
                    <div class="schedule-builder" data-supported="{{ 'true' if job.supported else 'false' }}" data-minute="{{ job.minute }}" data-hour="{{ job.hour }}" data-day="{{ job.day }}" data-month="{{ job.month }}" data-weekday="{{ job.weekday }}"></div>
                    <div class="job-command">{{ job.command }}</div>
                    <div class="job-status-edit"><input type="checkbox" class="enabled-checkbox" {% if job.enabled %}checked{% endif %}><label>有効</label></div>
                    <div class="job-actions-edit"><button class="save-btn" onclick="saveJob({{ job.id }})">保存</button><button class="cancel-btn" onclick="cancelEdit({{ job.id }})">キャンセル</button></div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <p>Cronジョブが見つかりません。</p>
        {% endif %}
        <div id="message" class="message"></div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
