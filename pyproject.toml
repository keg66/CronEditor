[project]
name = "croneditor"
version = "0.1.0"
description = "Web-based cron job editor for Raspberry Pi"
dependencies = [
    "Flask>=2.3.3",
]
requires-python = ">=3.8"

[tool.uv]
# CronEditor is run directly from app.py; it is not a distributable package.
# Keeping this disabled prevents `uv sync` from attempting an unnecessary build.
package = false
